<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Permisos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    .colores {
        background-color: #716ace;
        border-radius: 5px;
        padding: 10px;
        margin-bottom: 10px;
        color: white;
      }
      </style>
</head>
<body  style="background-color: #cad7de;">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Administración de Permisos</h2>
            <a href="{% url 'crear_permiso' %}" class="btn btn-success"> Asignar Permiso</a>
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
             <tr>
          <th>ID</th>
          <th>Nombre</th>
        <th>Código (Codename)</th>
        <th>Tipo de Contenido</th>
          <th class="text-center">Acciones</th>
          </tr>
        </thead>
           <tbody>
             {% for permiso in permisos %}
          <tr>
             <td>{{ permiso.id }}</td>
             <td>{{ permiso.name }}</td>
              <td><code>{{ permiso.codename }}</code></td>
                 <td>{{ permiso.content_type }}</td>
                 <td class="text-center">
                      <a href="{% url 'editar_permiso' permiso.id %}" class="btn btn-sm btn-outline-warning">Editar</a>
                      <a href="{% url 'eliminar_permiso' permiso.id %}" class="btn btn-sm btn-outline-danger">Eliminar</a>
                     </td>
                  </tr>
             {% empty %}
              <tr>
             <td colspan="5" class="text-center text-muted py-3" style="background-color: #f6bfac;">No hay permisos registrados.</td>
                 </tr>
            {% endfor %}
                </tbody>
            </table>
             </div>
               </div>
          </div>
</body>
</html>
