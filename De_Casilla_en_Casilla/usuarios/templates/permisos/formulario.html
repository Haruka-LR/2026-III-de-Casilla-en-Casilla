<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Permiso | Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .form-container {
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #141415;
            padding: 2.5rem;
        }
        .form-title {
            color: #1e293b;
            font-weight: 600;
            font-size: 1.35rem;
            border-bottom: 2px solid #040404;
            padding-bottom: 0.5rem;
        }
        .form-label {
            font-weight: 500;
            color: #9f7bcb;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container py-5">
  <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                
         <div class="form-container shadow-sm">
              <h1 class="form-title mb-4">Registrar Nuevo Permiso</h1>

            <form method="post" class="needs-validation" novalidate>
                   {% csrf_token %}

             <div class="mb-3">
                   <label for="{{ form.name.id_for_label }}" class="form-label">Nombre del Permiso</label>
                      {{ form.name }}
                      <div class="form-text text-muted">Ejemplo: "Puede agregar mas preguntas
                      "</div>
                        </div>

                 <div class="mb-3">
                   <label for="{{ form.codename.id_for_label }}" class="form-label">Código de Identificación (Codename)</label>
                       {{ form.codename }}
                      <div class="form-text text-muted">Nombre clave sin espacios </div>
                 </div>

                <div class="mb-4">
                      <label for="{{ form.content_type.id_for_label }}" class="form-label">Módulo / Modelo Asociado</label>
                   {{ form.content_type }}
                     </div>

                 <div class="d-flex justify-content-end align-items-center gap-2 pt-3 border-top">
                      <a href="{% url 'listar_permisos' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                      <button type="submit" class="btn btn-success px-4">Guardar Permiso</button>
                </div>
                 </form>
                </div>

              </div>
           </div>
           </div>
</body>
</html>
